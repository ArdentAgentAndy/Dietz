<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dietz</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#0e0e10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dietz">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css?v=72">
<script>
  // Phone mode, set before first paint (see js/phoneMode.js — keep in step).
  (function () {
    var v = null;
    try { v = localStorage.getItem('dietz:phoneMode'); } catch (e) {}
    var on = v === 'on' || (v !== 'off' && window.matchMedia('(max-width: 700px)').matches);
    if (on) document.documentElement.classList.add('phone-mode');
  })();
</script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
</head>
<body>
<header class="topnav">
  <div class="topnav-left">
    <a class="brand" href="#/">//</a>
    <!-- Same number as every ?v= cache-bust query param across the app; bump
         them all together, but only when explicitly asked to — not on every change. -->
    <span class="app-version mono">v=72</span>
    <button class="sync-btn" id="sync-btn" title="Sync now">&#8635;</button>
    <span class="sync-status" id="sync-status" data-status="unconfigured"></span>
  </div>
  <div class="topnav-right">
    <nav id="top-nav"></nav>
    <button type="button" class="icon-btn phone-mode-btn" id="phone-mode-btn" aria-label="Phone mode (this device only)" aria-pressed="false">
      <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><rect x="4" y="1.5" width="8" height="13" rx="1.6"/><path d="M7 12.2h2" stroke-linecap="round"/></svg>
    </button>
    <a href="#/settings" class="icon-btn" title="Settings" aria-label="Settings">&#9881;</a>
    <nav id="top-nav-menu"></nav>
  </div>
</header>
<main id="app"></main>
<script type="module" src="js/app.js?v=72"></script>
</body>
</html>
